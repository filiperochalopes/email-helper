[project]
name = "email-helper"
version = "0.1.0"
description = "Assistente local de foco e limpeza de múltiplas contas de e-mail, com busca PostgreSQL e LLM configurável."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "imapclient>=3.0",
    "google-api-python-client>=2.140",
    "google-auth>=2.32",
    "google-auth-oauthlib>=1.2",
    "typer>=0.12",
    "rich>=13.7",
    "readchar>=4.1",
    "ruamel.yaml>=0.18",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "langfuse>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
agent = "email_agent.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Typer usa Argument/Option como defaults para declarar a interface da CLI.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
