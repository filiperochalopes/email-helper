[project]
name = "email-agent"
version = "0.1.0"
description = "Agente de monitoramento, classificação e organização de múltiplas contas de e-mail (Gmail API + IMAP), com resumo matinal via WhatsApp (Evolution API)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "imapclient>=3.0",
    "google-api-python-client>=2.140",
    "google-auth>=2.32",
    "google-auth-oauthlib>=1.2",
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "langfuse>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
email-agent = "email_agent.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
