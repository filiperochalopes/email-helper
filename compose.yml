x-app-common: &app-common
  build: .
  env_file: .env
  environment:
    ACCOUNTS_FILE: /secrets/accounts.yml
    GMAIL_OAUTH_CLIENT_SECRET_FILE: /secrets/gmail_client_secret.json
    GMAIL_TOKEN_STORAGE_PATH: /secrets/gmail_tokens
  restart: unless-stopped
  volumes:
    - ./src:/app/src
    - ./tests:/app/tests
    - ./migrations:/app/migrations
    - ./data:/data
    - ./secrets:/secrets
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
    - ai
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_started

services:
  app:
    <<: *app-common
    ports:
      - "127.0.0.1:8010:8000"

  worker:
    <<: *app-common
    command: celery -A email_agent.workers.celery_app worker --loglevel=INFO --concurrency=4

  beat:
    <<: *app-common
    command: celery -A email_agent.workers.celery_app beat --loglevel=INFO

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: emailagent
      POSTGRES_PASSWORD: emailagent
      POSTGRES_DB: emailagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 300 1 --appendonly no
    volumes:
      - valkeydata:/data

volumes:
  pgdata:
  valkeydata:

networks:
  ai:
    external: true
