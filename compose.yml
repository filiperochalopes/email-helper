x-app-common: &app-common
  build: .
  env_file: .env
  environment:
    ACCOUNTS_FILE: /secrets/accounts.yml
    GMAIL_OAUTH_CLIENT_SECRET_FILE: /secrets/gmail_client_secret.json
    GMAIL_TOKEN_STORAGE_PATH: /secrets/gmail_tokens
  restart: unless-stopped
  volumes:
    - ./src:/app/src
    - ./tests:/app/tests
    - ./migrations:/app/migrations
    - ./data:/data
    - ./secrets:/secrets
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app-common
    ports:
      - "127.0.0.1:8010:8000"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: emailagent
      POSTGRES_PASSWORD: emailagent
      POSTGRES_DB: emailagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
