x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://emailagent:emailagent@email-helper-db:5432/emailagent
  ACCOUNTS_FILE: /secrets/accounts.yml
  GMAIL_OAUTH_CLIENT_SECRET_FILE: /secrets/gmail_client_secret.json
  GMAIL_TOKEN_STORAGE_PATH: /secrets/gmail_tokens

x-app-common: &app-common
  build: .
  # Tag explícita e compartilhada: sem ela cada serviço deriva um nome próprio
  # e `docker compose run` reconstrói a imagem inteira em vez de reusar a do app.
  image: email-helper-app:local
  env_file: .env
  environment: *app-env
  restart: unless-stopped
  volumes:
    - ./src:/app/src
    - ./tests:/app/tests
    - ./migrations:/app/migrations
    - ./data:/data
    - ./secrets:/secrets
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
  depends_on:
    email-helper-db:
      condition: service_healthy

services:
  email-helper-app:
    <<: *app-common
    ports:
      - "127.0.0.1:8010:8000"

  # Trabalho offline pesado de LLM (cartão de estilo, futura otimização DSPy).
  # `profiles` mantém o serviço fora do `docker compose up`; ele sobe só em
  # `docker compose run --rm email-helper-compose <comando>`, que habilita o
  # profile sozinho. Aponta para o modelo forte no LM Studio do host, enquanto a
  # triagem segue no modelo pequeno do Ollama.
  email-helper-compose:
    <<: *app-common
    profiles: ["compose"]
    restart: "no"
    environment:
      <<: *app-env
      LLM_PROVIDER: openai_compatible
      LLM_BASE_URL: http://host.docker.internal:1234
      LLM_MODEL: google/gemma-4-26b-a4b-qat
      # LM Studio recusa `json_object`; ver LLM_JSON_MODE em config.py.
      LLM_JSON_MODE: "off"
      LLM_MAX_CONCURRENCY: "2"
    entrypoint: ["agent"]
    command: ["--help"]

  email-helper-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: emailagent
      POSTGRES_PASSWORD: emailagent
      POSTGRES_DB: emailagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
